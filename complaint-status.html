<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Complaint</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eff6ff 0%, #fdf2f8 35%, #fff7ed 100%);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 620px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            color: #475569;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            background: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .track-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(124, 58, 237, 0.25);
        }

        .track-btn:hover {
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 22px 20px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 14px;
            background: linear-gradient(135deg, #f8fbff, #fdf2f8);
        }

        .result h2 {
            margin-bottom: 15px;
            color: #1e293b;
        }

        .detail {
            margin: 12px 0;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.7);
        }

        .detail strong {
            display: inline-block;
            width: 140px;
            color: #475569;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            color: #1d4ed8;
            font-weight: bold;
        }

        .error {
            display: none;
            margin-top: 15px;
            color: #991b1b;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Track Complaint</h1>

    <p class="subtitle">
        Enter your Complaint ID to check the current status
    </p>

    <form id="trackForm">

        <label for="complaintId">Complaint ID</label>

        <input
            type="text"
            id="complaintId"
            placeholder="Paste your complaint tracking ID"
            required
        >

        <button type="submit" class="track-btn">
            Track Complaint
        </button>

    </form>

    <p class="error" id="errorMessage">
        Complaint not found. Please check your Complaint ID.
    </p>

    <div class="result" id="result">

        <h2>Complaint Details</h2>

        <div class="detail">
            <strong>Complaint ID:</strong>
            <span id="displayId"></span>
        </div>

        <div class="detail">
            <strong>Category:</strong>
            <span id="displayCategory"></span>
        </div>

        <div class="detail">
            <strong>Submitted:</strong>
            <span id="displayDate"></span>
        </div>

        <div class="detail">
            <strong>Status:</strong>
            <span class="status" id="displayStatus"></span>
        </div>

        <div class="detail">
            <strong>Last Updated:</strong>
            <span id="displayUpdated"></span>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-app.js"></script>

</body>
</html>
