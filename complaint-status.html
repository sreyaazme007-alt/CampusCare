<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Complaint - Campus Complaint Box</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #333;
        }

        .track-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .track-btn:hover {
            opacity: 0.9;
        }

        .track-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .result h2 {
            margin-bottom: 15px;
        }

        .detail {
            margin: 12px 0;
            line-height: 1.5;
        }

        .detail strong {
            display: inline-block;
            width: 140px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-weight: bold;
        }

        .status.resolved {
            background: #d4edda;
            color: #155724;
        }

        .status.in-progress {
            background: #cce5ff;
            color: #004085;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .error {
            display: none;
            margin-top: 15px;
            color: #c62828;
            text-align: center;
        }

        .loading {
            display: none;
            margin-top: 15px;
            text-align: center;
            color: #555;
        }

        .details-btn {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .details-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Track Complaint</h1>

    <p class="subtitle">
        Enter your Complaint ID to check the current status
    </p>

    <form id="trackForm">

        <label for="complaintId">Complaint ID</label>

        <input
            type="text"
            id="complaintId"
            placeholder="Enter your Complaint ID"
            required
        >

        <button type="submit" class="track-btn" id="trackButton">
            Track Complaint
        </button>

    </form>

    <p class="loading" id="loadingMessage">
        Checking complaint...
    </p>

    <p class="error" id="errorMessage">
        Complaint not found. Please check your Complaint ID.
    </p>

    <div class="result" id="result">

        <h2>Complaint Details</h2>

        <div class="detail">
            <strong>Complaint ID:</strong>
            <span id="displayId"></span>
        </div>

        <div class="detail">
            <strong>Category:</strong>
            <span id="displayCategory"></span>
        </div>

        <div class="detail">
            <strong>Submitted:</strong>
            <span id="displayDate"></span>
        </div>

        <div class="detail">
            <strong>Status:</strong>
            <span class="status" id="displayStatus"></span>
        </div>

        <div class="detail">
            <strong>Last Updated:</strong>
            <span id="displayUpdated"></span>
        </div>

    </div>

    <a href="complaint-details.html" class="details-btn" id="detailsButton">
        View Resolved Complaints & Feedback
    </a>

</div>


<script type="module">

    import { db } from "./firebase-config.js";

    import {
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


    const trackForm = document.getElementById("trackForm");

    const complaintIdInput =
        document.getElementById("complaintId");

    const trackButton =
        document.getElementById("trackButton");

    const loadingMessage =
        document.getElementById("loadingMessage");

    const errorMessage =
        document.getElementById("errorMessage");

    const result =
        document.getElementById("result");

    const detailsButton =
        document.getElementById("detailsButton");


    function formatDate(timestamp) {

        if (!timestamp) {
            return "Not available";
        }

        try {

            const date = timestamp.toDate();

            return date.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "long",
                year: "numeric"
            });

        } catch (error) {

            return "Not available";

        }
    }


    function setStatusStyle(statusElement, status) {

        statusElement.className = "status";

        if (status === "Resolved") {
            statusElement.classList.add("resolved");
        }
        else if (status === "In Progress") {
            statusElement.classList.add("in-progress");
        }
        else {
            statusElement.classList.add("pending");
        }
    }


    trackForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const complaintId =
            complaintIdInput.value.trim();

        if (!complaintId) {
            return;
        }


        // Reset previous messages

        result.style.display = "none";
        errorMessage.style.display = "none";
        detailsButton.style.display = "none";

        loadingMessage.style.display = "block";
        trackButton.disabled = true;


        try {

            // Get complaint from Firestore

            const complaintReference =
                doc(db, "complaints", complaintId);

            const complaintSnapshot =
                await getDoc(complaintReference);


            if (!complaintSnapshot.exists()) {

                loadingMessage.style.display = "none";
                errorMessage.style.display = "block";
                trackButton.disabled = false;

                return;
            }


            const complaint =
                complaintSnapshot.data();


            // Display complaint ID

            document.getElementById("displayId").textContent =
                complaintSnapshot.id;


            // Display category

            document.getElementById("displayCategory").textContent =
                complaint.category || "Not available";


            // Display submitted date

            document.getElementById("displayDate").textContent =
                formatDate(complaint.createdAt);


            // Display status

            const status =
                complaint.status || "Pending";

            const statusElement =
                document.getElementById("displayStatus");

            statusElement.textContent = status;

            setStatusStyle(statusElement, status);


            // Display updated date

            document.getElementById("displayUpdated").textContent =
                formatDate(complaint.updatedAt);


            // Show result

            loadingMessage.style.display = "none";
            errorMessage.style.display = "none";
            result.style.display = "block";

            trackButton.disabled = false;


            // If complaint is resolved,
            // show link to resolved complaints page

            if (status === "Resolved") {

                detailsButton.style.display = "block";

            }


        } catch (error) {

            console.error("Error checking complaint:", error);

            loadingMessage.style.display = "none";
            errorMessage.textContent =
                "Unable to check complaint. Please try again.";

            errorMessage.style.display = "block";

            trackButton.disabled = false;

        }

    });

</script>

</body>
</html>
