<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authority Dashboard - Campus Complaint Box</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        /* HEADER */
        header {
            background: #1f3c88;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .authority-panel {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .authority-text {
            font-size: 14px;
        }

        #logoutButton {
            background: white;
            color: #1f3c88;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #logoutButton:hover {
            background: #e9eefc;
        }

        /* MAIN */
        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .page-title {
            font-size: 30px;
            margin-bottom: 20px;
            color: #1f3c88;
        }

        /* ALERT */
        .alert {
            background: #fff3cd;
            border: 1px solid #ffe69c;
            color: #664d03;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: none;
        }

        /* STATISTICS */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #555;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #1f3c88;
        }

        /* FILTER SECTION */
        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .filter-section h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #333;
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
        }

        .filters input,
        .filters select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        /* TABLE */
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        .table-container h2 {
            margin-bottom: 18px;
            font-size: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #1f3c88;
            color: white;
            padding: 13px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }

        tr:hover {
            background: #f7f9fc;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .progress {
            background: #cfe2ff;
            color: #084298;
        }

        .resolved {
            background: #d1e7dd;
            color: #0f5132;
        }

        .view-button {
            background: #1f3c88;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .view-button:hover {
            background: #162e69;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .loading-message {
            text-align: center;
            padding: 30px;
            color: #1f3c88;
            font-weight: bold;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.55);
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            border-radius: 10px;
            padding: 25px;
            position: relative;
        }

        .close-button {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #555;
        }

        .close-button:hover {
            color: black;
        }

        .modal-title {
            color: #1f3c88;
            margin-bottom: 20px;
            padding-right: 30px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail-box {
            background: #f5f6f8;
            padding: 12px;
            border-radius: 6px;
        }

        .detail-box.full {
            grid-column: 1 / -1;
        }

        .detail-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .detail-value {
            font-size: 14px;
            word-break: break-word;
        }

        .update-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .update-section h3 {
            margin-bottom: 12px;
        }

        #newStatus {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        #updateStatusButton {
            background: #1f3c88;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        #updateStatusButton:hover {
            background: #162e69;
        }

        /* RESPONSIVE */
        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .detail-box.full {
                grid-column: auto;
            }
        }

        @media (max-width: 500px) {
            header {
                padding: 15px;
            }

            .logo {
                font-size: 18px;
            }

            .authority-text {
                display: none;
            }

            .container {
                width: 95%;
                margin: 20px auto;
            }

            .page-title {
                font-size: 24px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-number {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">Campus Complaint Box</div>

        <div class="authority-panel">
            <div class="authority-text">Authority Panel</div>
            <button id="logoutButton">Logout</button>
        </div>
    </header>


    <!-- MAIN CONTENT -->
    <div class="container">

        <h1 class="page-title">Authority Dashboard</h1>

        <div id="alertMessage" class="alert"></div>


        <!-- STATISTICS -->
        <div class="stats">

            <div class="stat-card">
                <h3>Total Complaints</h3>
                <div id="totalCount" class="stat-number">0</div>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <div id="pendingCount" class="stat-number">0</div>
            </div>

            <div class="stat-card">
                <h3>In Progress</h3>
                <div id="progressCount" class="stat-number">0</div>
            </div>

            <div class="stat-card">
                <h3>Resolved</h3>
                <div id="resolvedCount" class="stat-number">0</div>
            </div>

        </div>


        <!-- FILTERS -->
        <div class="filter-section">

            <h2>Search & Filter Complaints</h2>

            <div class="filters">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by Complaint ID or Name..."
                >

                <select id="statusFilter">
                    <option value="All">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                </select>

                <select id="categoryFilter">
                    <option value="All">All Categories</option>
                    <option value="Academic">Academic</option>
                    <option value="Infrastructure">Infrastructure</option>
                    <option value="IT / Technical">IT / Technical</option>
                    <option value="Administration">Administration</option>
                    <option value="Library">Library</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Cleanliness">Cleanliness</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Security">Security</option>
                    <option value="Other">Other</option>
                </select>

            </div>
        </div>


        <!-- COMPLAINT TABLE -->
        <div class="table-container">

            <h2>Complaint Management</h2>

            <table>

                <thead>
                    <tr>
                        <th>Complaint ID</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Submitted Time</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="complaintsTableBody">

                    <tr>
                        <td colspan="7" class="loading-message">
                            Loading complaints...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- VIEW COMPLAINT MODAL -->
    <div id="complaintModal" class="modal">

        <div class="modal-content">

            <span id="closeModalButton" class="close-button">&times;</span>

            <h2 class="modal-title">Complaint Details</h2>

            <div id="complaintDetails" class="details"></div>

            <div class="update-section">

                <h3>Update Complaint Status</h3>

                <select id="newStatus">
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                </select>

                <button id="updateStatusButton">
                    Update Status
                </button>

            </div>

        </div>

    </div>


    <!-- FIREBASE + DASHBOARD JAVASCRIPT -->
    <script type="module">

        console.log("DASHBOARD SCRIPT STARTED");


        /* FIREBASE IMPORT */

        import { db } from "./firebase-config.js";

        import {
            collection,
            getDocs,
            updateDoc,
            doc
        } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


        console.log("Firebase modules imported successfully");


        /* VARIABLES */

        let complaints = [];
        let selectedComplaint = null;


        /* HTML ELEMENTS */

        const complaintsTableBody =
            document.getElementById("complaintsTableBody");

        const totalCount =
            document.getElementById("totalCount");

        const pendingCount =
            document.getElementById("pendingCount");

        const progressCount =
            document.getElementById("progressCount");

        const resolvedCount =
            document.getElementById("resolvedCount");

        const searchInput =
            document.getElementById("searchInput");

        const statusFilter =
            document.getElementById("statusFilter");

        const categoryFilter =
            document.getElementById("categoryFilter");

        const complaintModal =
            document.getElementById("complaintModal");

        const closeModalButton =
            document.getElementById("closeModalButton");

        const complaintDetails =
            document.getElementById("complaintDetails");

        const newStatus =
            document.getElementById("newStatus");

        const updateStatusButton =
            document.getElementById("updateStatusButton");

        const logoutButton =
            document.getElementById("logoutButton");

        const alertMessage =
            document.getElementById("alertMessage");


        /* LOAD COMPLAINTS */

        async function loadComplaints() {

            console.log("Connecting to Firestore...");

            complaintsTableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="loading-message">
                        Loading complaints from Firebase...
                    </td>
                </tr>
            `;

            try {

                const snapshot =
                    await getDocs(collection(db, "complaints"));

                complaints = [];

                snapshot.forEach((documentSnapshot) => {

                    complaints.push({
                        id: documentSnapshot.id,
                        ...documentSnapshot.data()
                    });

                });

                console.log(
                    "Complaints loaded:",
                    complaints
                );

                displayComplaints(complaints);

                updateStatistics();

                updateAlert();

            } catch (error) {

                console.error(
                    "Error loading complaints:",
                    error
                );

                complaintsTableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-message">
                            Unable to load complaints.
                            <br><br>
                            Check Firebase connection and Firestore rules.
                        </td>
                    </tr>
                `;

                alertMessage.style.display = "block";

                alertMessage.textContent =
                    "Error connecting to Firebase. Open the browser console to see the exact error.";

            }

        }


        /* DISPLAY COMPLAINTS */

        function displayComplaints(list) {

            complaintsTableBody.innerHTML = "";

            if (list.length === 0) {

                complaintsTableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-message">
                            No complaints found.
                        </td>
                    </tr>
                `;

                return;
            }


            list.forEach((complaint) => {

                const row =
                    document.createElement("tr");


                const idCell =
                    document.createElement("td");

                idCell.textContent =
                    complaint.id || "N/A";


                const nameCell =
                    document.createElement("td");

                nameCell.textContent =
                    complaint.name || "N/A";


                const roleCell =
                    document.createElement("td");

                roleCell.textContent =
                    complaint.role || "N/A";


                const categoryCell =
                    document.createElement("td");

                categoryCell.textContent =
                    complaint.category || "N/A";


                const statusCell =
                    document.createElement("td");

                const status =
                    complaint.status || "Pending";

                const statusSpan =
                    document.createElement("span");

                statusSpan.textContent = status;

                statusSpan.classList.add("status");


                if (status === "Pending") {

                    statusSpan.classList.add("pending");

                } else if (status === "In Progress") {

                    statusSpan.classList.add("progress");

                } else if (status === "Resolved") {

                    statusSpan.classList.add("resolved");

                }


                statusCell.appendChild(statusSpan);


                const timeCell =
                    document.createElement("td");

                timeCell.textContent =
                    formatDate(complaint.createdAt);


                const actionCell =
                    document.createElement("td");

                const viewButton =
                    document.createElement("button");

                viewButton.textContent = "View";

                viewButton.className = "view-button";

                viewButton.addEventListener(
                    "click",
                    () => viewComplaint(complaint)
                );


                actionCell.appendChild(viewButton);


                row.appendChild(idCell);
                row.appendChild(nameCell);
                row.appendChild(roleCell);
                row.appendChild(categoryCell);
                row.appendChild(statusCell);
                row.appendChild(timeCell);
                row.appendChild(actionCell);


                complaintsTableBody.appendChild(row);

            });

        }


        /* FORMAT DATE */

        function formatDate(timestamp) {

            if (!timestamp) {
                return "Not available";
            }

            try {

                if (
                    timestamp &&
                    typeof timestamp.toDate === "function"
                ) {

                    return timestamp.toDate().toLocaleString();

                }

                return new Date(timestamp).toLocaleString();

            } catch (error) {

                return "Not available";

            }

        }


        /* UPDATE STATISTICS */
        function updateStatistics() {

            const total =
                complaints.length;

            const pending =
                complaints.filter(
                    complaint =>
                        (complaint.status || "Pending") === "Pending"
                ).length;

            const progress =
                complaints.filter(
                    complaint =>
                        complaint.status === "In Progress"
                ).length;

            const resolved =
                complaints.filter(
                    complaint =>
                        complaint.status === "Resolved"
                ).length;


            totalCount.textContent = total;

            pendingCount.textContent = pending;

            progressCount.textContent = progress;

            resolvedCount.textContent = resolved;

        }


        /* ALERT */

        function updateAlert() {

            const pending =
                complaints.filter(
                    complaint =>
                        (complaint.status || "Pending") === "Pending"
                ).length;


            if (pending > 0) {

                alertMessage.style.display = "block";

                alertMessage.textContent =
                    pending +
                    " complaint(s) require attention.";

            } else {

                alertMessage.style.display = "none";

            }

        }


        /* FILTER */

        function filterComplaints() {

            const search =
                searchInput.value
                    .trim()
                    .toLowerCase();

            const selectedStatus =
                statusFilter.value;

            const selectedCategory =
                categoryFilter.value;


            const filtered =
                complaints.filter((complaint) => {

                    const id =
                        String(complaint.id || "")
                            .toLowerCase();

                    const name =
                        String(complaint.name || "")
                            .toLowerCase();

                    const category =
                        String(complaint.category || "");

                    const status =
                        complaint.status || "Pending";


                    const matchesSearch =
                        id.includes(search) ||
                        name.includes(search);

                    const matchesStatus =
                        selectedStatus === "All" ||
                        status === selectedStatus;

                    const matchesCategory =
                        selectedCategory === "All" ||
                        category === selectedCategory;


                    return (
                        matchesSearch &&
                        matchesStatus &&
                        matchesCategory
                    );

                });


            displayComplaints(filtered);

        }


        /* VIEW COMPLAINT */

        function viewComplaint(complaint) {

            selectedComplaint = complaint;


            complaintDetails.innerHTML = `

                <div class="detail-box">
                    <div class="detail-label">Complaint ID</div>
                    <div class="detail-value">
                        ${escapeHTML(complaint.id || "N/A")}
                    </div>
                </div>

                <div class="detail-box">
                    <div class="detail-label">Role</div>
                    <div class="detail-value">
                        ${escapeHTML(complaint.role || "N/A")}
                    </div>
                </div>

                <div class="detail-box">
                    <div class="detail-label">Name</div>
                    <div class="detail-value">
                        ${escapeHTML(complaint.name || "N/A")}
                    </div>
                </div>

                <div class="detail-box">
                    <div class="detail-label">Register / Employee ID</div>
                    <div class="detail-value">
                        ${escapeHTML(
                            complaint.registerNumber ||
                            complaint.employeeId ||
                            "N/A"
                        )}
                    </div>
                </div>

                <div class="detail-box">
                    <div class="detail-label">Department</div>
                    <div class="detail-value">
                        ${escapeHTML(
                            complaint.department || "N/A"
                        )}
                    </div>
                </div>

                <div class="detail-box">
                    <div class="detail-label">Semester</div>
                    <div class="detail-value">
                        ${escapeHTML(
                            complaint.semester || "N/A"
                        )}
                    </div>
                </div>

                <div class="detail-box">
                    <div class="detail-label">Class / Designation</div>
                    <div class="detail-value">
                        ${escapeHTML(
                            complaint.className ||
                            complaint.designation ||
                            "N/A"
                        )}
                    </div>
                </div>

                <div class="detail-box">
                    <div class="detail-label">Phone Number</div>
                    <div class="detail-value">
                        ${escapeHTML(
                            complaint.phone || "N/A"
                        )}
                    </div>
                </div>

                <div class="detail-box">
                    <div class="detail-label">Category</div>
                    <div class="detail-value">
                        ${escapeHTML(
                            complaint.category || "N/A"
                        )}
                    </div>
                </div>

                <div class="detail-box">
                    <div class="detail-label">Status</div>
                    <div class="detail-value">
                        ${escapeHTML(
                            complaint.status || "Pending"
                        )}
                    </div>
                </div>

                <div class="detail-box full">
                    <div class="detail-label">Complaint Description</div>
                    <div class="detail-value">
                        ${escapeHTML(
                            complaint.description || "N/A"
                        )}
                    </div>
                </div>

                <div class="detail-box full">
                    <div class="detail-label">Submitted Time</div>
                    <div class="detail-value">
                        ${escapeHTML(
                            formatDate(complaint.createdAt)
                        )}
                    </div>
                </div>

            `;


            newStatus.value =
                complaint.status || "Pending";


            complaintModal.style.display = "block";

        }


        /* CLOSE MODAL */

        function closeModal() {

            complaintModal.style.display = "none";

            selectedComplaint = null;

        }


        /* UPDATE STATUS */

        async function updateStatus() {

            if (!selectedComplaint) {

                return;

            }


            const status =
                newStatus.value;


            updateStatusButton.disabled = true;

            updateStatusButton.textContent =
                "Updating...";


            try {

                await updateDoc(
                    doc(
                        db,
                        "complaints",
                        selectedComplaint.id
                    ),
                    {
                        status: status
                    }
                );


                selectedComplaint.status =
                    status;


                const index =
                    complaints.findIndex(
                        complaint =>
                            complaint.id === selectedComplaint.id
                    );


                if (index !== -1) {

                    complaints[index].status =
                        status;

                }


                displayComplaints(
                    getFilteredComplaints()
                );

                updateStatistics();

                updateAlert();


                alert(
                    "Complaint status updated successfully!"
                );


                closeModal();

            } catch (error) {

                console.error(
                    "Error updating status:",
                    error
                );

                alert(
                    "Unable to update complaint status. Check the console."
                );

            } finally {

                updateStatusButton.disabled = false;

                updateStatusButton.textContent =
                    "Update Status";

            }

        }


        /* GET CURRENT FILTERED LIST */

        function getFilteredComplaints() {

            const search =
                searchInput.value
                    .trim()
                    .toLowerCase();

            const selectedStatus =
                statusFilter.value;

            const selectedCategory =
                categoryFilter.value;


            return complaints.filter((complaint) => {

                const id =
                    String(complaint.id || "")
                        .toLowerCase();

                const name =
                    String(complaint.name || "")
                        .toLowerCase();

                const category =
                    String(complaint.category || "");

                const status =
                    complaint.status || "Pending";


                return (
                    (id.includes(search) ||
                        name.includes(search)) &&

                    (
                        selectedStatus === "All" ||
                        status === selectedStatus
                    ) &&

                    (
                        selectedCategory === "All" ||
                        category === selectedCategory
                    )
                );

            });

        }


        /* HTML SAFETY */

        function escapeHTML(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }


        /* LOGOUT */

        function logout() {

            window.location.href =
                "index.html";

        }


        /* EVENT LISTENERS */

        logoutButton.addEventListener(
            "click",
            logout
        );


        searchInput.addEventListener(
            "input",
            filterComplaints
        );


        statusFilter.addEventListener(
            "change",
            filterComplaints
        );


        categoryFilter.addEventListener(
            "change",
            filterComplaints
        );


        closeModalButton.addEventListener(
            "click",
            closeModal
        );


        updateStatusButton.addEventListener(
            "click",
            updateStatus
        );


        window.addEventListener(
            "click",
            (event) => {

                if (event.target === complaintModal) {

                    closeModal();

                }

            }
        );


        /* START DASHBOARD */

        loadComplaints();

    </script>

</body>
</html>
