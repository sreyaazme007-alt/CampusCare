<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authority Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #dbeafe 0%, #fdf2f8 35%, #fff7ed 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(79, 70, 229, 0.18);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            color: #475569;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            background: #ffffff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(124, 58, 237, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .login-btn:hover {
            opacity: 0.96;
            transform: translateY(-1px);
            box-shadow: 0 16px 30px rgba(124, 58, 237, 0.3);
        }

        .back-home {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            color: #1e293b;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .back-home:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }

        .error-message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #991b1b;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            border: 1px solid rgba(239, 68, 68, 0.15);
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Authority Login</h1>

    <p class="subtitle">
        Login to manage campus complaints
    </p>

    <form id="loginForm">

        <div class="input-group">
            <label for="username">Email</label>

            <input
                type="email"
                id="username"
                placeholder="Enter username or email"
                required
            >
        </div>

        <div class="input-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <a href="index.html" class="back-home">← Back to Homepage</a>

    <div class="error-message" id="errorMessage">
        Invalid username or password.
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-app.js"></script>

</body>
</html>
