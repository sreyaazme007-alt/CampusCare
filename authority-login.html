<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authority Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #333;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .error-message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #ffebee;
            color: #c62828;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Authority Login</h1>

    <p class="subtitle">
        Login to manage campus complaints
    </p>

    <form id="loginForm">

        <div class="input-group">
            <label for="username">Username / Email</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username or email"
                required
            >
        </div>

        <div class="input-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="error-message" id="errorMessage">
        Invalid username or password.
    </div>

</div>

<script>

    document.getElementById("loginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        /*
            Temporary demo login.

            Later this will be replaced with
            Firebase Authentication.
        */

        if (username === "admin" && password === "admin123") {

            window.location.href = "authority-dashboard.html";

        } else {

            document.getElementById("errorMessage").style.display = "block";

        }

    });

</script>

</body>
</html>
