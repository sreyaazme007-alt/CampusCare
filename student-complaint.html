<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Complaint Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 30px 15px;
            background: linear-gradient(135deg, #eef6ff 0%, #fce7f3 35%, #ecfdf5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: min(100%, 650px);
            margin: auto;
            background: linear-gradient(135deg, #eef6ff 0%, #fdf2f8 35%, #f0fdf4 100%);
            backdrop-filter: blur(10px);
            padding: 32px 28px 28px;
            border-radius: 24px;
            box-shadow: 0 22px 50px rgba(139, 92, 246, 0.18);
            border: 1px solid rgba(147, 197, 253, 0.8);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #1f2937;
            font-size: clamp(2rem, 3vw, 2.4rem);
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 28px;
            font-size: 0.98rem;
        }

        form {
            display: grid;
            gap: 4px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: 700;
            color: #374151;
            font-size: 0.96rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid #d9d4ff;
            border-radius: 12px;
            font-size: 15px;
            background: linear-gradient(135deg, #ffffff 0%, #f9f5ff 100%);
            color: #1f2937;
            transition: all 0.25s ease;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
            color: #94a3b8;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
            background: #fff;
        }

        .submit-btn {
            width: 100%;
            margin-top: 26px;
            padding: 15px 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #7c3aed 0%, #ec4899 42%, #f59e0b 100%);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0 12px 22px rgba(168, 85, 247, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(168, 85, 247, 0.36);
            opacity: 0.98;
        }

        .success-message {
            display: none;
            margin-top: 22px;
            padding: 15px 18px;
            background: linear-gradient(135deg, #dcfce7, #f0fdf4);
            color: #166534;
            border: 1px solid #86efac;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            box-shadow: 0 10px 18px rgba(22, 101, 52, 0.08);
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 18px 20px;
                border-radius: 18px;
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body data-role="Student">

<div class="container">

    <h1>Student Complaint</h1>
    <p class="subtitle">Register your complaint</p>

    <form id="complaintForm">

        <label for="name">Full Name</label>
        <input type="text" id="name" required>

        <label for="registerNumber">Register Number</label>
        <input type="text" id="registerNumber" required>

        <label for="department">Department</label>
        <input type="text" id="department" placeholder="Eg: CSE" required>

        <label for="semester">Semester</label>
        <select id="semester" required>
            <option value="">Select Semester</option>
            <option>Semester 1</option>
            <option>Semester 2</option>
            <option>Semester 3</option>
            <option>Semester 4</option>
            <option>Semester 5</option>
            <option>Semester 6</option>
            <option>Semester 7</option>
            <option>Semester 8</option>
        </select>

        <label for="className">Class</label>
        <input type="text" id="className" placeholder="Eg: CSE B" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" required>

        <label for="category">Complaint Category</label>
        <select id="category" required>
            <option value="">Select Category</option>
            <option>Academic</option>
            <option>Infrastructure</option>
            <option>Hostel</option>
            <option>Transportation</option>
            <option>Library</option>
            <option>Food/Canteen</option>
            <option>Cleanliness</option>
            <option>Other</option>
        </select>

        <label for="description">Complaint Description</label>
        <textarea id="description"
                  placeholder="Describe your complaint..."
                  required></textarea>

        <label for="image">Upload Image (Optional)</label>
        <input type="file" id="image" accept="image/*">

        <button type="submit" class="submit-btn">
            Register Complaint
        </button>

    </form>

    <div class="success-message" id="successMessage">
        Complaint registered successfully!
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-app.js"></script>

</body>
</html>
