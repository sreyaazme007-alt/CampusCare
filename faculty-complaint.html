<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Complaint Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eff6ff 0%, #fdf2f8 35%, #fff7ed 100%);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 630px;
            margin: auto;
            background: rgba(255, 255, 255, 0.93);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            color: #475569;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            background: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .submit-btn {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(124, 58, 237, 0.25);
        }

        .submit-btn:hover {
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .success-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #dcfce7, #bbf7d0);
            color: #166534;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            border: 1px solid rgba(34, 197, 94, 0.12);
        }
    </style>
</head>

<body data-role="Faculty">

<div class="container">

    <h1>Faculty Complaint</h1>
    <p class="subtitle">Register your complaint</p>

    <form id="complaintForm">

        <label for="name">Full Name</label>
        <input type="text" id="name" required>

        <label for="employeeId">Employee ID</label>
        <input type="text" id="employeeId" required>

        <label for="department">Department</label>
        <input type="text" id="department" placeholder="Eg: CSE" required>

        <label for="designation">Designation</label>
        <input type="text" id="designation"
               placeholder="Eg: Assistant Professor" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" required>

        <label for="category">Complaint Category</label>
        <select id="category" required>
            <option value="">Select Category</option>
            <option>Academic</option>
            <option>Infrastructure</option>
            <option>IT / Technical</option>
            <option>Administration</option>
            <option>Library</option>
            <option>Transportation</option>
            <option>Cleanliness</option>
            <option>Other</option>
        </select>

        <label for="description">Complaint Description</label>
        <textarea id="description"
                  placeholder="Describe your complaint..."
                  required></textarea>

        <label for="image">Upload Image (Optional)</label>
        <input type="file" id="image" accept="image/*">

        <button type="submit" class="submit-btn">
            Register Complaint
        </button>

    </form>

    <div class="success-message" id="successMessage">
        Complaint registered successfully!
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-app.js"></script>

</body>
</html>
